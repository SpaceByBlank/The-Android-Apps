
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AppVault - My App Collection</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d1117;color:#f0f6fc;font-family:Arial,sans-serif}
header{padding:22px 7%;border-bottom:1px solid #30363d;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:24px;font-weight:bold;color:#58a6ff}
button{background:#238636;color:white;border:0;padding:11px 17px;border-radius:7px;cursor:pointer}
main{max-width:1100px;margin:55px auto;padding:20px}
.hero{text-align:center;margin-bottom:35px}
h1{font-size:42px;margin-bottom:10px}
p{color:#8b949e;line-height:1.6}
input,select{background:#161b22;border:1px solid #30363d;color:white;padding:13px;border-radius:7px;width:100%;margin:8px 0}
.search{max-width:600px;margin:25px auto}
.filters{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin:25px}
.filters button{background:#21262d;border:1px solid #30363d}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:20px}
.card h3{margin:8px 0}
.icon{font-size:38px}
.card a{display:inline-block;margin:12px 8px 0 0;color:#58a6ff;text-decoration:none}
.modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:20px}
.modal-content{background:#161b22;border:1px solid #30363d;padding:24px;border-radius:12px;width:100%;max-width:450px}
</style>
</head>
<body>
<header>
<div class="logo">◈ AppVault</div>
<button onclick="openForm()">+ Add App</button>
</header>
<main>
<section class="hero">
<h1>Your Apps. One Vault.</h1>
<p>Your Personal App Library</p>
<div class="search">
<input id="search" placeholder="Search applications..." oninput="render()">
</div>
</section>
<div class="filters" id="filters"></div>
<h2>My Applications</h2>
<p id="count"></p>
<div class="grid" id="apps"></div>
</main>
<div class="modal" id="modal">
<div class="modal-content">
<h2>Add Application</h2>
<input id="name" placeholder="Application name">
<select id="category">
<option>Productivity</option><option>Video Editing</option>
<option>Utilities</option><option>File Management</option>
<option>Entertainment</option><option>Gaming</option><option>Open Source</option>
</select>
<input id="description" placeholder="Short description">
<input id="website" placeholder="Official website URL">
<input id="download" placeholder="Download URL">
<button onclick="saveApp()">Save Application</button>
<button onclick="closeForm()" style="background:#30363d">Cancel</button>
</div>
</div>
<script>
const initial=[
{name:"VLC",category:"Entertainment",description:"Free and open-source media player.",icon:"🎬",website:"https://www.videolan.org/vlc/download-android.html"},
{name:"LocalSend",category:"Utilities",description:"Share files locally between devices.",icon:"📡",website:"https://localsend.org/"},
{name:"Obtainium",category:"Open Source",description:"Get app updates directly from their sources.",icon:"📦",website:"https://github.com/ImranR98/Obtainium"}
];
let apps=JSON.parse(localStorage.getItem("appvault"))||initial;
let active="All";
const categories=["All","Productivity","Video Editing","Utilities","File Management","Entertainment","Gaming","Open Source"];
function render(){
filters.innerHTML=categories.map(c=>`<button onclick="active='${c}';render()">${c}</button>`).join("");
let q=document.getElementById("search").value.toLowerCase();
let shown=apps.filter(a=>(active==="All"||a.category===active)&&(a.name+" "+a.description).toLowerCase().includes(q));
count.textContent=shown.length+" applications";
document.getElementById("apps").innerHTML=shown.map((a,i)=>`<div class="card"><div class="icon">${a.icon||"📱"}</div><h3>${a.name}</h3><p>${a.category}</p><p>${a.description}</p><a href="${a.website||"#"}" target="_blank">Official Website ↗</a><a href="${a.download||a.website||"#"}" target="_blank">Download ↗</a><br><button onclick="editApp(${apps.indexOf(a)})" style="margin-top:12px">Edit</button> <button onclick="deleteApp(${apps.indexOf(a)})" style="background:#da3633">Delete</button></div>`).join("");
}
function persist(){localStorage.setItem("appvault",JSON.stringify(apps));render()}
function openForm(){modal.style.display="flex"}
function closeForm(){modal.style.display="none"}
function saveApp(){
let n=name.value.trim();if(!n){alert("Enter app name");return}
apps.push({name:n,category:category.value,description:description.value,website:website.value,download:download.value,icon:"📱"});
persist();closeForm();name.value="";description.value="";website.value="";download.value="";
}
function deleteApp(i){if(confirm("Delete this application?")){apps.splice(i,1);persist()}}
function editApp(i){
let a=apps[i];let n=prompt("Application name",a.name);if(n===null)return;
a.name=n;let d=prompt("Description",a.description);if(d!==null)a.description=d;persist();
}
render();
</script>
</body>
</html>
